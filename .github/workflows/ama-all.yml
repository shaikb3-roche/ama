name: ci-ama-test
run-name: GROUP - ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}

on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      utils: ${{ steps.filter.outputs.utils }}
      pluggy: ${{ steps.filter.outputs.pluggy }}
      db: ${{ steps.filter.outputs.db }}
      contents: ${{ steps.filter.outputs.contents }}
      core: ${{ steps.filter.outputs.core }}
      plugin-gcr: ${{ steps.filter.outputs.plugin-gcr }}
      plugin-gcs: ${{ steps.filter.outputs.plugin-gcs }}
      plugin-posix: ${{ steps.filter.outputs.plugin-posix }}
      plugin-s3: ${{ steps.filter.outputs.plugin-s3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            utils:
              - 'client/amapy-utils/**'
            pluggy:
              - 'client/amapy-pluggy/**'
            db:
              - 'client/amapy-db/**'
            contents:
              - 'client/amapy-contents/**'
            core:
              - 'client/amapy-core/**'
            plugin-gcr:
              - 'client/amapy-plugin-gcr/**'
            plugin-gcs:
              - 'client/amapy-plugin-gcs/**'
            plugin-posix:
              - 'client/amapy-plugin-posix/**'
            plugin-s3:
              - 'client/amapy-plugin-s3/**'

      - name: Debug changed flags and files
        run: |
          echo "utils=${{ steps.filter.outputs.utils }}"
          echo "pluggy=${{ steps.filter.outputs.pluggy }}"
          echo "db=${{ steps.filter.outputs.db }}"
          echo "contents=${{ steps.filter.outputs.contents }}"
          echo "core=${{ steps.filter.outputs.core }}"
          echo "plugin-gcr=${{ steps.filter.outputs['plugin-gcr'] }}"
          echo "plugin-gcs=${{ steps.filter.outputs['plugin-gcs'] }}"
          echo "plugin-posix=${{ steps.filter.outputs['plugin-posix'] }}"
          echo "plugin-s3=${{ steps.filter.outputs['plugin-s3'] }}"
          echo "Changed vs main:"
          git diff --name-only refs/remotes/origin/main...HEAD | sed 's/^/  /'
          echo "Matched contents files:"
          echo "${{ steps.filter.outputs.contents_files }}" | tr ' ' '\n' | sed 's/^/  /'
          echo "Matched core files:"
          echo "${{ steps.filter.outputs.core_files }}" | tr ' ' '\n' | sed 's/^/  /'
name: ci-amapy
run-name: GROUP - ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}

on:
  push:
    branches:
      - '**'
    tags:
      - 'utils-v*.*.*'
      - 'pluggy-v*.*.*'
      - 'db-v*.*.*'
      - 'contents-v*.*.*'
      - 'core-v*.*.*'
      - 'plugin-gcr-v*.*.*'
      - 'plugin-gcs-v*.*.*'
      - 'plugin-posix-v*.*.*'
      - 'plugin-s3-v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  # Detect which packages changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      utils: ${{ steps.filter.outputs.utils }}
      pluggy: ${{ steps.filter.outputs.pluggy }}
      db: ${{ steps.filter.outputs.db }}
      contents: ${{ steps.filter.outputs.contents }}
      core: ${{ steps.filter.outputs.core }}
      plugin-gcr: ${{ steps.filter.outputs.plugin-gcr }}
      plugin-gcs: ${{ steps.filter.outputs.plugin-gcs }}
      plugin-posix: ${{ steps.filter.outputs.plugin-posix }}
      plugin-s3: ${{ steps.filter.outputs.plugin-s3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important: full history so diffs work

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell               # expose *_files outputs for debugging
          filters: |
            utils:
              - 'client/amapy-utils/**'
            pluggy:
              - 'client/amapy-pluggy/**'
            db:
              - 'client/amapy-db/**'
            contents:
              - 'client/amapy-contents/**'
            core:
              - 'client/amapy-core/**'
            plugin-gcr:
              - 'client/amapy-plugin-gcr/**'
            plugin-gcs:
              - 'client/amapy-plugin-gcs/**'
            plugin-posix:
              - 'client/amapy-plugin-posix/**'
            plugin-s3:
              - 'client/amapy-plugin-s3/**'

      - name: Debug changed flags and files
        run: |
          echo "utils=${{ steps.filter.outputs.utils }}"
          echo "pluggy=${{ steps.filter.outputs.pluggy }}"
          echo "db=${{ steps.filter.outputs.db }}"
          echo "contents=${{ steps.filter.outputs.contents }}"
          echo "core=${{ steps.filter.outputs.core }}"
          echo "plugin-gcr=${{ steps.filter.outputs['plugin-gcr'] }}"
          echo "plugin-gcs=${{ steps.filter.outputs['plugin-gcs'] }}"
          echo "plugin-posix=${{ steps.filter.outputs['plugin-posix'] }}"
          echo "plugin-s3=${{ steps.filter.outputs['plugin-s3'] }}"
          echo ""
          echo "Changed files vs main:"
          git diff --name-only refs/remotes/origin/main...HEAD | sed 's/^/  /'
          echo ""
          for k in contents core utils pluggy db 'plugin-gcr' 'plugin-gcs' 'plugin-posix' 'plugin-s3'; do
            vname="${k}_files"
            echo "Matched by $k:"
            echo "${{ steps.filter.outputs['dummy'] }}" >/dev/null 2>&1 || true
          done
          echo "  contents: ${{ steps.filter.outputs.contents_files }}"
          echo "  core:     ${{ steps.filter.outputs.core_files }}"
          echo "  utils:    ${{ steps.filter.outputs.utils_files }}"
          echo "  pluggy:   ${{ steps.filter.outputs.pluggy_files }}"
          echo "  db:       ${{ steps.filter.outputs.db_files }}"
          echo "  plugin-gcr: ${{ steps.filter.outputs['plugin-gcr_files'] }}"
          echo "  plugin-gcs: ${{ steps.filter.outputs['plugin-gcs_files'] }}"
          echo "  plugin-posix: ${{ steps.filter.outputs['plugin-posix_files'] }}"
          echo "  plugin-s3: ${{ steps.filter.outputs['plugin-s3_files'] }}"

  ci-amapy-utils:
    needs: detect-changes
    if: needs['detect-changes'].outputs.utils == 'true' || startsWith(github.ref, 'refs/tags/utils-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup CI environment
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install dependencies
        working-directory: client/amapy-utils
        run: python -m pip install -e .
      - name: Run flake8
        continue-on-error: true
        working-directory: client/amapy-utils
        run: flake8 .
      - name: Run tests
        continue-on-error: true
        working-directory: client/amapy-utils
        run: pytest --cov=./ --cov-report=xml
      - name: Build package
        working-directory: client/amapy-utils
        run: python -m build
      - name: Check package
        working-directory: client/amapy-utils
        run: twine check dist/*
      - name: Store built package
        if: startsWith(github.ref, 'refs/tags/utils')
        uses: actions/upload-artifact@v4
        with:
          name: amapy-utils-dist
          path: client/amapy-utils/dist/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/utils')
        working-directory: client/amapy-utils
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

