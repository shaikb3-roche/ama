      - name: Run flake8
        continue-on-error: true
        working-directory: client/amapy-pluggy
        run: flake8 .
      - name: Run tests
        continue-on-error: true
        working-directory: client/amapy-pluggy
        run: pytest --cov=./ --cov-report=xml
      - name: Build package
        working-directory: client/amapy-pluggy
        run: python -m build
      - name: Check package
        working-directory: client/amapy-pluggy
        run: twine check dist/*
      - name: Store built package
        if: startsWith(github.ref, 'refs/tags/pluggy')
        uses: actions/upload-artifact@v4
        with:
          name: amapy-pluggy-dist
          path: client/amapy-pluggy/dist/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/pluggy')
        working-directory: client/amapy-pluggy
