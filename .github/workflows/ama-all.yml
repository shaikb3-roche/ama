          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  ci-amapy-db:
    needs: detect-changes
    if: needs['detect-changes'].outputs.db == 'true' || startsWith(github.ref, 'refs/tags/db-v')
